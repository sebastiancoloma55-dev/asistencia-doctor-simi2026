<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Doctor y farmacia moderna</title><desc id="desc">Ilustración juvenil de un farmacéutico amable de bigote blanco y bata, junto a una farmacia azul y turquesa.</desc>
