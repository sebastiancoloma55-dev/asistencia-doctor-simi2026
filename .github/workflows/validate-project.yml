name: Validación del proyecto RRHH

on:
  push:
    branches:
      - main
      - feature/talana-bot-integration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Pruebas Python y política horaria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sintaxis Python
        run: python -m compileall -q bot_talana
      - name: Ejecutar pruebas unitarias sin credenciales reales
        run: python -m unittest discover -s bot_talana/tests -v

  javascript-check:
    name: Validar sintaxis JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Revisar archivos JS y scripts inline de index.html
        run: node scripts/validate-js.mjs
