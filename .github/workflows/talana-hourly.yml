name: Bot Talana - horario Chile

on:
  # UTC: cubre la ventana posible en UTC; el guardia filtra 08:00-17:59 de Santiago en verano e invierno.
  # El guardia Python valida hora local, fines de semana y feriados.
  schedule:
    - cron: "0 11-22 * * 1-5"
  workflow_dispatch:
  pull_request:
    paths:
      - "bot_talana/**"
      - ".github/workflows/talana-hourly.yml"

permissions:
  contents: read

concurrency:
  group: talana-bot-cloud
  cancel-in-progress: false

jobs:
  validate-python:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar sintaxis Python
        run: python -m compileall -q bot_talana

  run-talana:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar horario y feriados de Chile
        id: schedule
        run: python bot_talana/holiday_schedule_guard.py

      - name: Consultar si el panel permite ejecutar
        id: bot_check
        if: steps.schedule.outputs.run_bot == 'true' && hashFiles('bot_talana/agent_cloud.py') && hashFiles('bot_talana/integracion_supabase.py')
        env:
          TALANA_BOT_URL: ${{ secrets.TALANA_BOT_URL }}
          TALANA_BOT_SECRET: ${{ secrets.TALANA_BOT_SECRET }}
        run: python bot_talana/agent_cloud.py --check

      - name: Informar que falta incorporar el ejecutor de Talana
        if: steps.schedule.outputs.run_bot == 'true' && (!hashFiles('bot_talana/agent_cloud.py') || !hashFiles('bot_talana/talana_downloader.py'))
        run: |
          echo "::warning::Horario válido, pero falta incorporar bot_talana/agent_cloud.py y/o bot_talana/talana_downloader.py. No se ejecutó ninguna descarga."
          echo "La programación está preparada; el bot no queda activo hasta incorporar y probar el ejecutor real."

      - name: Instalar dependencias del bot
        if: steps.schedule.outputs.run_bot == 'true' && steps.bot_check.outputs.run_bot == 'true' && hashFiles('bot_talana/agent_cloud.py') && hashFiles('bot_talana/talana_downloader.py')
        run: |
          python -m pip install --upgrade pip
          pip install -r bot_talana/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar descarga de Talana
        if: steps.schedule.outputs.run_bot == 'true' && hashFiles('bot_talana/agent_cloud.py') && hashFiles('bot_talana/talana_downloader.py')
        env:
          TALANA_BOT_URL: ${{ secrets.TALANA_BOT_URL }}
          TALANA_BOT_SECRET: ${{ secrets.TALANA_BOT_SECRET }}
          TALANA_USER: ${{ secrets.TALANA_USER }}
          TALANA_PASSWORD: ${{ secrets.TALANA_PASSWORD }}
          TALANA_DOWNLOAD_DIR: ${{ runner.temp }}/talana-downloads
        run: python bot_talana/agent_cloud.py --once
