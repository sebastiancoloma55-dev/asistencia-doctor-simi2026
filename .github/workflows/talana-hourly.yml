name: Bot Talana - horario Chile

on:
  # GitHub cron usa UTC; holiday_schedule_guard.py aplica la hora local de Chile y omite fines de semana/feriados.
  schedule:
    - cron: "0 11-22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo seguro por defecto; la importación completa escribe en producción"
        required: true
        type: choice
        options:
          - validate_only
          - preview_import
          - full_import
        default: validate_only
      confirm_write:
        description: "Para autorizar escrituras reales, selecciona CONFIRMO_IMPORTACION"
        required: true
        type: choice
        options:
          - NO
          - CONFIRMO_IMPORTACION
        default: NO
  push:
    branches:
      - main
    paths:
      - "bot_talana/**"
      - ".github/workflows/talana-hourly.yml"
  pull_request:
    paths:
      - "bot_talana/**"
      - ".github/workflows/talana-hourly.yml"

permissions:
  contents: read

concurrency:
  group: talana-bot-cloud
  cancel-in-progress: false

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar sintaxis Python
        run: python -m compileall -q bot_talana
      - name: Instalar dependencias de validación
        run: pip install -r bot_talana/requirements.txt
      - name: Probar importador de reportes Talana
        run: python -m unittest discover -s bot_talana -p 'test_*.py' -v
      - name: Preparar Node para validación TypeScript
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxis de la función de Supabase
        run: npx --yes esbuild@0.25.0 supabase/functions/talana-bot-control/index.ts --loader:.ts=ts --bundle --external:jsr:* --format=esm --outfile=/tmp/talana-bot-control.js

  run-talana:
    needs: validate-python
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Bloquear importación sin confirmación explícita
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full_import'
        env:
          CONFIRM_WRITE: ${{ inputs.confirm_write }}
        run: |
          if [ "$CONFIRM_WRITE" != "CONFIRMO_IMPORTACION" ]; then
            echo "::error::Importación detenida: selecciona CONFIRMO_IMPORTACION para autorizar escrituras en producción."
            exit 1
          fi
          echo "Confirmación explícita recibida; se verificará además que el bot esté habilitado en Supabase."

      - name: Descargar código de la rama autorizada
        uses: actions/checkout@v4
        with:
          ref: feat/coberturas-responsables-multiselect

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar horario y feriados de Chile
        id: schedule
        if: github.event_name != 'workflow_dispatch'
        run: python bot_talana/holiday_schedule_guard.py

      - name: Generar tareas recurrentes aprobadas
        if: github.event_name == 'schedule' && steps.schedule.outputs.run_bot == 'true'
        continue-on-error: true
        env:
          TALANA_BOT_URL: ${{ secrets.TALANA_BOT_URL }}
          TALANA_BOT_SECRET: ${{ secrets.TALANA_BOT_SECRET }}
        run: python bot_talana/agent_cloud.py --maintenance

      - name: Consultar si el panel permite ejecutar
        id: bot_check
        if: ((github.event_name == 'workflow_dispatch' && inputs.mode == 'full_import') || (github.event_name != 'workflow_dispatch' && steps.schedule.outputs.run_bot == 'true')) && hashFiles('bot_talana/agent_cloud.py') && hashFiles('bot_talana/integracion_supabase.py')
        env:
          TALANA_BOT_URL: ${{ secrets.TALANA_BOT_URL }}
          TALANA_BOT_SECRET: ${{ secrets.TALANA_BOT_SECRET }}
        run: python bot_talana/agent_cloud.py --check

      - name: Detener importación si el panel mantiene el bot pausado
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full_import' && steps.bot_check.outputs.run_bot != 'true'
        env:
          SKIP_REASON: ${{ steps.bot_check.outputs.skip_reason }}
        run: |
          echo "::error::Importación no iniciada: el panel de Supabase mantiene el bot deshabilitado o el modo no autoriza la ejecución."
          echo "Motivo: $SKIP_REASON"
          exit 1

      - name: Validar reportes sin escribir en Supabase
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'validate_only'
        env:
          TALANA_BOT_URL: ${{ secrets.TALANA_BOT_URL }}
          TALANA_BOT_SECRET: ${{ secrets.TALANA_BOT_SECRET }}
          TALANA_USER: ${{ secrets.TALANA_USER }}
          TALANA_PASSWORD: ${{ secrets.TALANA_PASSWORD }}
          TALANA_DOWNLOAD_DIR: ${{ runner.temp }}/talana-downloads
        run: |
          pip install -r bot_talana/requirements.txt
          python -m playwright install --with-deps chromium
          python bot_talana/agent_cloud.py --validate-only

      - name: Informar que falta incorporar el ejecutor de Talana
        if: ((github.event_name == 'workflow_dispatch' && inputs.mode != 'validate_only') || (github.event_name != 'workflow_dispatch' && steps.schedule.outputs.run_bot == 'true')) && (!hashFiles('bot_talana/agent_cloud.py') || !hashFiles('bot_talana/talana_downloader.py'))
        run: |
          echo "::warning::Falta incorporar bot_talana/agent_cloud.py y/o bot_talana/talana_downloader.py. No se ejecutó ninguna descarga."
          echo "La programación está preparada; el bot no queda activo hasta incorporar y probar el ejecutor real."

      - name: Instalar dependencias del bot
        if: ((github.event_name == 'workflow_dispatch' && inputs.mode == 'preview_import') || ((github.event_name == 'workflow_dispatch' && inputs.mode == 'full_import') && steps.bot_check.outputs.run_bot == 'true') || (github.event_name != 'workflow_dispatch' && steps.schedule.outputs.run_bot == 'true')) && hashFiles('bot_talana/agent_cloud.py') && hashFiles('bot_talana/talana_downloader.py')
        run: |
          python -m pip install --upgrade pip
          pip install -r bot_talana/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ejecutar descarga de Talana
        if: ((github.event_name == 'workflow_dispatch' && inputs.mode == 'preview_import') || ((github.event_name == 'workflow_dispatch' && inputs.mode == 'full_import') && steps.bot_check.outputs.run_bot == 'true') || (github.event_name != 'workflow_dispatch' && steps.schedule.outputs.run_bot == 'true')) && hashFiles('bot_talana/agent_cloud.py') && hashFiles('bot_talana/talana_downloader.py')
        env:
          TALANA_BOT_URL: ${{ secrets.TALANA_BOT_URL }}
          TALANA_BOT_SECRET: ${{ secrets.TALANA_BOT_SECRET }}
          TALANA_USER: ${{ secrets.TALANA_USER }}
          TALANA_PASSWORD: ${{ secrets.TALANA_PASSWORD }}
          TALANA_DOWNLOAD_DIR: ${{ runner.temp }}/talana-downloads
          TALANA_PREVIEW_IMPORT: ${{ inputs.mode == 'preview_import' && 'true' || 'false' }}
        run: |
          if [ "$TALANA_PREVIEW_IMPORT" = "true" ]; then
            python bot_talana/agent_cloud.py --preview-import
          else
            python bot_talana/agent_cloud.py --once
          fi
